[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ai-virtual-tryon-studio"
version = "0.4.2"
description = "Desktop AI virtual try-on studio: pose-aware garment warping and diffusion-based rendering for Windows."
readme = "CONTRIBUTING.md"
requires-python = ">=3.11,<3.13"
license = { text = "Apache-2.0" }
authors = [
  { name = "Try-On Studio Contributors" },
]
keywords = ["virtual-tryon", "viton", "diffusion", "pose-estimation", "fashion-ai"]

dependencies = [
  "numpy>=1.26,<2.1",
  "opencv-python>=4.10",
  "onnxruntime>=1.18",
  "pillow>=10.3",
  "pydantic>=2.7",
  "PySide6>=6.7",
  "rich>=13.7",
  "tomli>=2.0; python_version < '3.11'",
  "watchdog>=4.0",
]

[project.optional-dependencies]
gpu = [
  "onnxruntime-gpu>=1.18",
  "torch>=2.4",
  "torchvision>=0.19",
]
dev = [
  "pytest>=8.2",
  "pytest-qt>=4.4",
  "ruff>=0.6",
  "mypy>=1.11",
  "hypothesis>=6.100",
]

[project.scripts]
tryon-studio = "ai_virtual_tryon.app:main"
tryon-cli = "ai_virtual_tryon.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_virtual_tryon"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/ai_virtual_tryon/core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"